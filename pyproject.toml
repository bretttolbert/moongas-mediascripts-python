[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mediascripts"
version = "1.2.1"
requires-python = ">=3.11"
authors = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
maintainers = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
description = "Python scripts for working with Moongas media collections."
readme = "README.md"
license = { file = "LICENSE.txt" }
keywords = [
  "moongas", 
  "mediascan", 
  "music",
  "metadata",
  "database",
  "python",
  "audio",
  "media",
  "tagging",
  "file management",
  "file organization"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  'Intended Audience :: End Users/Desktop',
  'Intended Audience :: Education',
  'Intended Audience :: Science/Research',
  'Topic :: Utilities',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "mediascan >= 1.2.1",
  "mediatest >= 1.2.1"
]

[project.scripts]
artist-countries-to-mapgraph-json = "artist.artist_mapgraph.artist_countries_to_mapgraph_json:main"
artist-csv-to-artist-yaml = "artist.artist_csv_to_yaml.artist_csv_to_artist_yaml:main"
artist-yaml-auto-populate = "artist.artist_yaml.artist_yaml_auto_populate:main"
artist-yaml-reformat-with-files-yaml = "artist.artist_yaml.artist_yaml_reformat_with_files_yaml:main"
artist-yaml-test-with-files-yaml = "artist.artist_yaml.artist_yaml_test_with_files_yaml:main"
convert-covers = "convert.convert_covers:main"
convert-videos = "convert.convert_videos:main"
copy-medialib = "copy.copy_medialib:main"
generate-dataclasses = "dev.generate_dataclasses:main"
genre-clusters = "stats.genre_clusters:main"
list-artists-from-files-yaml = "media_files_yaml.list_artists_from_files_yaml:main"
list-missing-region-names = "artist.artist_mapgraph.list_missing_region_names:main"
make-covers-video = "convert.make_covers_video:main"
mediastats = "stats.mediastats:main"
play-rand-file-from-files-yaml = "media_files_yaml.play_rand_file_from_files_yaml:main"
rename-album-files = "rename.rename_album_files:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.1.0",
  "pytest>=9.1.1",
]
stats = [
  "matplotlib>=3.10.9 ; python_version < '3.10'",
  "matplotlib>=3.11.1 ; python_version > '3.10'",
  "numpy>=2.2.6 ; python_version < '3.12'",
  "numpy>=2.5.2 ; python_version >= '3.12'",
  "scikit-learn>=1.3.2 ; python_version < '3.12'",
  "scikit-learn>=1.3.2 ; python_version >= '3.12'",
]
llm = [
  "openai>=3.13.0",
  "PyYAML>=6.0.3",
  "tqdm>=4.67.0",
]

[project.urls]
"Homepage" = "https://github.com/bretttolbert/moongas-mediasripts-python"
Documentation = "https://github.com/bretttolbert/moongas-mediasripts-python"
Repository = "https://github.com/bretttolbert/moongas-mediasripts-python.git"
"Bug Tracker" = "https://github.com/bretttolbert/moongas-mediasripts-python/issues"
Changelog = "https://github.com/bretttolbert/moongas-mediasripts-python/blob/master/CHANGELOG.md"

[tool.setuptools.package-data]
mediascan = ['py.typed']
scripts = ['shell/*.sh']

[tool.setuptools.packages.find]
where = ["src"]
include = ["mediascripts"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "tests"
]
norecursedirs = [
  ".env*",
  ".venv*",
  ".git",
  ".tox",
  "build",
  "dist",
  "env*",
  "venv*",
  "docs",
  "__pycache__",
  "out"
]
addopts = [
  "--ignore=.git",
  "--ignore=.tox",
  "--ignore=build",
  "--ignore=dist",
  "--ignore=__pycache__",
  "--ignore=out"
]

[tool.ruff]
# Set the maximum line length to match your GitHub Actions setup
line-length = 127

[tool.ruff.lint]
# Enable Flake8 syntax/error equivalents (E9, F63, F7, F82)
# "E" and "F" enable pycodestyle errors and Pyflakes
select = ["E9", "F63", "F7", "F82"]

# Enable McCabe complexity checking (equivalent to flake8 --max-complexity=10)
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
mypy_path = "typings"

[[tool.mypy.overrides]]
module = "*.pyi"
ignore_errors = true
